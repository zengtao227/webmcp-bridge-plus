# Sample tunnel-client profile for the private DevSpace adapter.
#
# Install to: ~/.config/tunnel-client/devspace.yaml
#
# Properties that matter for the security boundary:
#   * mcp.commands points at the adapter entrypoint; tunnel-client spawns us
#     over stdio so there is no port, no socket, and no OAuth metadata to serve.
#   * api_key is a reference only. The installer uses a persistent 0600 file.
#   * tunnel_id is a placeholder; fill in the actual id you got from OpenAI.
config_version: 1
control_plane:
  base_url: "https://api.openai.com"

  tunnel_id: "<YOUR_TUNNEL_ID_HERE>"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  # Ephemeral loopback avoids a fixed-port conflict. The installer writes the
  # resolved address to tunnel-client's per-alias health URL file.
  listen_addr: "127.0.0.1:0"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      command: "/Users/zengtao/.local/bin/webmcp-devspace-adapter"
