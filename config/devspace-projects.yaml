# DevSpace execution-host registry.
#
# Data-only. No secrets, runtime tokens, Tunnel API keys, or workspaceId.
# Each host exposes exactly one approved workspace root. open_workspace accepts
# only that exact root; project directories beneath it are handled inside the
# opened workspace instead of being registered one by one.
# No arbitrary absolute paths. No fallback host. Fail closed on invalid input.

version: 1

hosts:
  macbook-pro:
    # app: routing/planned metadata only (see docs). The current single-host
    # deployment uses the already-connected DevSpace backend; do NOT attempt to
    # invoke or switch to an App named "devspace-macbook-pro".
    app: devspace-macbook-pro
    approvedRoot: "/work/My code"

  # Future host — EXAMPLE ONLY, not yet deployed. Do not treat as live.
  # mac-mini:
  #   app: devspace-mac-mini
  #   approvedRoot: "/work/Code"
