<svg viewBox="0 0 680 530" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DevSpace 接入方案对比：V1 Funnel 公网暴露 vs V2 Secure MCP Tunnel</title>
<desc>左列是 V1，ChatGPT 经公网访问 Tailscale Funnel 暴露的入口再到 DevSpace；右列是 V2，本机 tunnel-client 主动外连 OpenAI Secure MCP Tunnel，通过 stdio 启动私有适配器访问仅监听 127.0.0.1 的 DevSpace。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="34" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#791F1F">V1 · Funnel 公网暴露</text>
<text x="368" y="34" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">V2 · Secure MCP Tunnel</text>

<rect x="40" y="48" width="272" height="436" rx="16" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<rect x="368" y="48" width="272" height="436" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>

<rect x="56" y="76" width="240" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="176" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#791F1F" text-anchor="middle" dominant-baseline="central">ChatGPT</text>
<text x="176" y="108" font-family="Arial, sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">remote MCP caller</text>
<path d="M176 121 L176 137" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="139" width="240" height="44" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="176" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#791F1F" text-anchor="middle" dominant-baseline="central">公网互联网</text>
<text x="176" y="171" font-family="Arial, sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">存在外部扫描风险</text>
<path d="M176 184 L176 200" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="202" width="240" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="176" y="218" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#791F1F" text-anchor="middle" dominant-baseline="central">Tailscale Funnel</text>
<text x="176" y="234" font-family="Arial, sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">公网 HTTPS 入站入口</text>
<path d="M176 247 L176 263" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="265" width="240" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="176" y="281" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#791F1F" text-anchor="middle" dominant-baseline="central">DevSpace</text>
<text x="176" y="297" font-family="Arial, sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">公网入口可达</text>
<path d="M176 310 L176 326" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="328" width="240" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="176" y="344" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#791F1F" text-anchor="middle" dominant-baseline="central">较宽 Docker 挂载</text>
<text x="176" y="360" font-family="Arial, sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">潜在影响面更大</text>
<path d="M176 373 L176 389" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="391" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="176" y="407" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">依赖人工关闭</text>
<text x="176" y="423" font-family="Arial, sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">遗漏步骤会 fail-open</text>

<rect x="384" y="76" width="240" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="504" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">ChatGPT</text>
<text x="504" y="108" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Developer-mode Plugin</text>
<path d="M504 121 L504 137" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="384" y="139" width="240" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="504" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">OpenAI Secure MCP Tunnel</text>
<text x="504" y="171" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Mac 主动建立 outbound 连接</text>
<path d="M504 184 L504 200" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="384" y="202" width="240" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="504" y="218" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">tunnel-client</text>
<text x="504" y="234" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">LaunchAgent supervised</text>
<path d="M504 247 L504 263" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="384" y="265" width="240" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="504" y="281" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">stdio 私有适配器</text>
<text x="504" y="297" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">无 TCP 端口，无 Unix socket</text>
<path d="M504 310 L504 326" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="384" y="328" width="240" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="504" y="344" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">DevSpace</text>
<text x="504" y="360" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">127.0.0.1:7676 only</text>
<path d="M504 373 L504 389" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="384" y="391" width="240" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="504" y="407" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">收窄 Docker 挂载</text>
<text x="504" y="423" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Secret Firewall + mount boundary</text>

<text x="40" y="508" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#791F1F">遗漏关闭步骤 → 可能公网可见</text>
<text x="368" y="508" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">配置/认证失败 → 不可用（fail-closed）</text>
</svg>
